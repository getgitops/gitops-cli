version: 2
updates:
  # Mantiene al día los SHA de las actions fijadas en los workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Misma política que tools:update: no se adoptan releases de menos de 7 días.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
