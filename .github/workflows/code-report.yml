name: Code Report

on:
  push:
    branches: [development, main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install GitOps CLI
        run: npm install --global @getgitops/cli@1.2.1

      - name: Run Code Report scan
        env:
          API_URL: https://cloud.getgitops.com/api
          API_KEY: ${{ secrets.GITOPS_API_KEY }}
        run: >-
          gops creport scan
          --api-url "$API_URL"
          --api-key "$API_KEY"
          --service gitops-cli
          --project gitops
          --git-branch "${GITHUB_REF_NAME}"
          --git-repo-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --git-author "${GITHUB_ACTOR}"
          --git-version "${GITHUB_REF}"
          --git-commit "${GITHUB_SHA}"
          --tags github-actions ci
